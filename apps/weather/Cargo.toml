[package]
name = "weather"
version = "1.0.0"
edition = "2024"
description = "A pikiosk weather app: current conditions, hourly chart and 8-day forecast from Open-Meteo"
license = "MIT"

[dependencies]
anyhow = "1"
egui = { version = "0.37", default-features = false }
kiosk-kit = { git = "https://github.com/pierrejochem/pikiosk", branch = "master" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
